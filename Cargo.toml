[workspace]
members = ["crates/metropolix-core", "crates/metropolix-web", "crates/neuropolis-plugin"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/fushugaku/neuropolis"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
